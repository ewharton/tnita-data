name: mirror-arns-data-to-gh-pages

on:
  schedule:
    - cron: "0 0 29 2 *"   # temporarily disabled: runs only on Feb 29
  workflow_dispatch:
    inputs:
      snapshot_date:
        description: "Expected snapshot_date (YYYYMMDD) for validation"
        required: false
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/mirror.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch data files via ArNS with gateway fallback
        run: |
          set -e
          mkdir -p public

          ARNS_NAME="the-network"
          GATEWAYS="arweave.net ar-io.dev vilenarios.com arweave.fllstck.dev g8way.io"
          SNAPSHOT_DATE="${{ inputs.snapshot_date }}"

          # fetch_one: try ArNS name on each gateway until one succeeds
          fetch_one () {
            local NAME="$1"
            local OUT="public/$NAME"
            echo "Fetching $NAME ..."
            for GW in $GATEWAYS; do
              URL="https://${ARNS_NAME}.${GW}/${NAME}"
              echo "  Trying $URL"
              if curl -fsSL --retry 2 --retry-delay 3 --max-time 120 "$URL" -o "$OUT.tmp" 2>/dev/null && [ -s "$OUT.tmp" ]; then
                mv "$OUT.tmp" "$OUT"
                echo "  OK via $GW ($(wc -c < "$OUT") bytes)"
                return 0
              fi
              rm -f "$OUT.tmp"
            done
            echo "  FAILED to fetch $NAME from any gateway"
            return 1
          }

          fetch_one collectors_artists_agg.json

          # Validate snapshot_date if provided
          if [ -n "$SNAPSHOT_DATE" ]; then
            GOT_DATE=$(python3 -c "import json,sys; print(json.load(sys.stdin).get('meta',{}).get('snapshot_date',''))" < public/collectors_artists_agg.json)
            if [ "$GOT_DATE" != "$SNAPSHOT_DATE" ]; then
              echo "FATAL: snapshot_date mismatch: got='$GOT_DATE' expected='$SNAPSHOT_DATE'"
              echo "Aborting to preserve existing data."
              exit 1
            fi
            echo "snapshot_date validated: $GOT_DATE"
          else
            echo "WARN: No snapshot_date input provided, skipping date validation"
          fi

          echo "Mirror updated at $(date -u)" > public/index.html
          echo "All files fetched and validated successfully."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
