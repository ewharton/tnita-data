name: mirror-arns-data-to-gh-pages

on:
  schedule:
    - cron: "0 0 29 2 *"   # temporarily disabled: runs only on Feb 29
  workflow_dispatch:
    inputs:
      snapshot_date:
        description: "Expected snapshot_date (YYYYMMDD) for validation"
        required: false
      generated_at:
        description: "Expected meta.generated_at (ISO timestamp) for validation"
        required: false
      agg_tx_id:
        description: "Direct aggTxId fallback (used only if ArNS serves stale data)"
        required: false
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/mirror.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch collectors_artists_agg.json via ArNS with gateway fallback
        run: |
          set -e
          mkdir -p public

          ARNS_NAME="the-network"
          GATEWAYS="arweave.net ar-io.dev vilenarios.com arweave.fllstck.dev g8way.io"
          SNAPSHOT_DATE="${{ inputs.snapshot_date }}"
          GENERATED_AT="${{ inputs.generated_at }}"
          AGG_TX_ID="${{ inputs.agg_tx_id }}"
          OUT="public/collectors_artists_agg.json"

          check_date () {
            local FILE="$1"
            if [ -z "$SNAPSHOT_DATE" ]; then return 0; fi
            GOT=$(python3 -c "import json,sys; print(json.load(sys.stdin).get('meta',{}).get('snapshot_date',''))" < "$FILE")
            if [ "$GOT" = "$SNAPSHOT_DATE" ]; then
              echo "    snapshot_date validated: $GOT"
              return 0
            else
              echo "    STALE: snapshot_date='$GOT' expected='$SNAPSHOT_DATE'"
              return 1
            fi
          }

          check_generated_at () {
            local FILE="$1"
            if [ -z "$GENERATED_AT" ]; then return 0; fi
            GOT=$(python3 -c "import json,sys; print(json.load(sys.stdin).get('meta',{}).get('generated_at',''))" < "$FILE")
            if [ "$GOT" = "$GENERATED_AT" ]; then
              echo "    generated_at validated: $GOT"
              return 0
            else
              echo "    MISMATCH: generated_at='$GOT' expected='$GENERATED_AT'"
              return 1
            fi
          }

          check_all () {
            local FILE="$1"
            check_date "$FILE" && check_generated_at "$FILE"
          }

          # Phase 1: Try ArNS on each gateway, validate date on every response
          echo "Phase 1: Fetching via ArNS ..."
          FOUND=false
          for GW in $GATEWAYS; do
            URL="https://${ARNS_NAME}.${GW}/collectors_artists_agg.json"
            echo "  Trying $URL"
            if curl -fsSL --retry 2 --retry-delay 3 --max-time 120 "$URL" -o "$OUT.tmp" 2>/dev/null && [ -s "$OUT.tmp" ]; then
              echo "  Got response via $GW ($(wc -c < "$OUT.tmp") bytes)"
              if check_all "$OUT.tmp"; then
                mv "$OUT.tmp" "$OUT"
                FOUND=true
                break
              fi
            fi
            rm -f "$OUT.tmp"
          done

          # Phase 2: If ArNS served stale data and agg_tx_id was provided, try direct txId
          if [ "$FOUND" = false ] && [ -n "$AGG_TX_ID" ]; then
            echo ""
            echo "Phase 2: ArNS stale or unavailable. Trying direct aggTxId $AGG_TX_ID ..."
            for GW in $GATEWAYS; do
              URL="https://${GW}/${AGG_TX_ID}"
              echo "  Trying $URL"
              if curl -fsSL --retry 2 --retry-delay 3 --max-time 120 "$URL" -o "$OUT.tmp" 2>/dev/null && [ -s "$OUT.tmp" ]; then
                echo "  Got response via $GW ($(wc -c < "$OUT.tmp") bytes)"
                if check_all "$OUT.tmp"; then
                  mv "$OUT.tmp" "$OUT"
                  FOUND=true
                  break
                fi
              fi
              rm -f "$OUT.tmp"
            done
          fi

          if [ "$FOUND" = false ]; then
            echo ""
            echo "FATAL: Could not fetch fresh collectors_artists_agg.json from any source."
            echo "Aborting to preserve existing data."
            exit 1
          fi

          echo ""
          echo "Mirror updated at $(date -u)" > public/index.html
          echo "Mirror fetch complete."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
