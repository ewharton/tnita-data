name: update-and-mirror
on:
  schedule:
    - cron: '0 10 * * 0'   # weekly, Sundays at 10:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ARWEAVE_JWK_B64: ${{ secrets.ARWEAVE_JWK_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Run updater
        run: node update_data.js

      - name: Job summary (success)
        if: success()
        run: |
          AGG=$(ls data/*/collectors_artists_agg.json 2>/dev/null | head -1)
          if [ -n "$AGG" ]; then
            echo "## Update completed successfully" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Snapshot date | $(jq -r '.meta.snapshot_date // "—"' "$AGG") |" >> $GITHUB_STEP_SUMMARY
            echo "| Total cards | $(jq -r '.meta.totalCards // "—"' "$AGG") |" >> $GITHUB_STEP_SUMMARY
            echo "| Artists | $(jq -r '.artists | length' "$AGG") |" >> $GITHUB_STEP_SUMMARY
            echo "| Collectors | $(jq -r '.collectors | length' "$AGG") |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Artifacts saved to \`data/\` and uploaded as workflow artifacts." >> $GITHUB_STEP_SUMMARY
          else
            echo "Update completed. See logs for details." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Job summary (failure)
        if: failure()
        run: |
          echo "## Workflow failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts have been uploaded for debugging. Download the \`data-*\` artifact." >> $GITHUB_STEP_SUMMARY

      - name: Upload data artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ github.run_id }}
          path: |
            data/**/*.json
            data/**/*.csv
            !data/**/collectors_cards.csv
          retention-days: 14
          if-no-files-found: ignore