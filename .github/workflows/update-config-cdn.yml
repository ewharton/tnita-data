name: update-config-cdn

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "config_updates.json"
      - "scripts/update_config_cdn.js"
      - ".github/workflows/update-config-cdn.yml"
      - "public/collectors_artists_agg.json"
      - "public/index.html"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update config and prepare public
        run: node scripts/update_config_cdn.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
